spring.application.name=finanzas-personal


# ======================================================
#  CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_finanzas
spring.datasource.username=postgres
spring.datasource.password=4636
spring.datasource.driver-class-name=org.postgresql.Driver


# ======================================================
#  JPA (Hibernate) - Configuración inicial
# ======================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG


# ======================================================
#  FLYWAY (Migraciones)
# ======================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Ubicación por defecto de los scripts: src/main/resources/db/migration/
spring.flyway.locations=classpath:db/migration
# Si la base de datos ya tiene tablas, no las borra, solo agrega migraciones pendientes
spring.flyway.validate-on-migrate=true
spring.flyway.mixed=true